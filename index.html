    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("pf-theme");
          var t = p === "light" || p === "dark" ? p : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F4F7FB");
        } catch (e) {}
      })();
    </script>
